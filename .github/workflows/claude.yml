name: Claude Bot Action
on:
  issue_comment:
    types: [created]

jobs:
  run-claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: anthropics/claude-code-action@main
        with:
          # Membaca API Key Anthropic asli dari Secrets
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_ASLI }}
          
          # Membaca Token GitHub target dari Secrets
          github_token: ${{ secrets.GITHUB_TOKEN }}
